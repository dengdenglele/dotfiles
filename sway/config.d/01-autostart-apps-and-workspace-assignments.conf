# Start applications at login
# Check CLI name with following commands
# which firefox
# flatpak list --app
exec firefox
exec flatpak run md.obsidian.Obsidian
exec code

# Assign applications to workspaces
# Check actual app_id with app open using following command
# swaymsg -t get_tree | jq '.. | objects | select(.type? == "con") | {name, app_id}'
assign [app_id="org.mozilla.firefox"] workspace number 1
assign [app_id="md.obsidian.Obsidian"] workspace number 2
assign [app_id="com.microsoft.VSCode"] workspace number 3
