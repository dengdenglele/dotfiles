<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>GeistMono Nerd Font</family>
      <family>Font Awesome 7 Free Solid</family>
      <family>Font Awesome 7 Brands</family>
    </prefer>
  </alias>
</fontconfig>

<!--Be sure to update the cache: `fc-cache -fv`-->
<!--Check if settings apply: `fc-match monospace`-->

<!--Do not use 'GeistMono Nerd Font Propo',-->
<!--because Propo means proportional spacing, which can break terminal alignment-->

<!--Verify installed GeistMono family names: `fc-list | grep Geist`-->

<!--Font Awesome XY is needed as fallback for ~/.config/waybar/config.jsonc-->
<!--It allows the glyphs to be properly displayed as icons in production-->
