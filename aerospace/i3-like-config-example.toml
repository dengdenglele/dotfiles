# Reference: https://github.com/i3/i3/blob/next/etc/config

config-version = 2

# Start AeroSpace at login
start-at-login = true

# You can use it to add commands that run after AeroSpace startup.
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = [
    'exec-and-forget open -a "Microsoft Teams"',
    'exec-and-forget open -a "Firefox"',
    'exec-and-forget sleep 5; open -a "Microsoft Outlook"',
#    'exec-and-forget open -a "Microsoft Outlook"',
#    'exec-and-forget sleep 10; aerospace workspace OUTLOOK',
]

# In i3, all workspaces are phantom
# If bracket is left blank, aerospace always starts with workspace '1'
persistent-workspaces = []

# Assign apps on particular workspaces
on-window-detected = [
    {
        if = 'test %{app-bundle-id} = org.mozilla.firefox',
        run = ['move-node-to-workspace 0001'],
    },
    {
        if = 'test %{app-bundle-id} = com.microsoft.Outlook',
        run = ['move-node-to-workspace 0000'],
    },
    {
        if = 'test %{app-bundle-id} = com.microsoft.teams2',
        run = ['move-node-to-workspace 1001'],
    },
]

# i3 doesn't have "normalizations" feature that why we disable them here.
# But the feature is very helpful.
# Normalizations eliminate all sorts of weird tree configurations that don't make sense.
# Give normalizations a chance and enable them back.
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false

# Mouse follows focus when focused monitor changes
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Automatically focuses a window when hovering over it with the mouse cursor,
# without requiring a click.
focus-follows-mouse.enabled = true

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = true

[mode.main.binding]

##############################################################################################
##### i3/sway-like keybindings ###############################################################
##############################################################################################

    # See: https://nikitabobko.github.io/AeroSpace/goodies#open-a-new-window-with-applescript
    # Disabled, because alt-enter interferes with Firefox's "Open Address or Search in New Foreground Tab"
#    alt-enter = '''exec-and-forget osascript -e \
#    'tell application "Terminal" to tell (do script) to activate' '''

    # i3 wraps focus by default (vim like)
    alt-h = 'focus --boundaries-action wrap-around-the-workspace left'
    alt-j = 'focus --boundaries-action wrap-around-the-workspace down'
    alt-k = 'focus --boundaries-action wrap-around-the-workspace up'
    alt-l = 'focus --boundaries-action wrap-around-the-workspace right'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # Consider using 'join-with' command as a 'split' replacement if you want to enable
    # normalizations
    alt-b = 'split horizontal'
    alt-v = 'split vertical'

    alt-f = 'fullscreen'

    alt-s = 'layout v_accordion' # 'layout stacking' in i3
    alt-w = 'layout h_accordion' # 'layout tabbed' in i3
    alt-e = 'layout tiles horizontal vertical' # 'layout toggle split' in i3
    alt-comma = 'layout accordion horizontal vertical'

    alt-shift-space = 'layout floating tiling' # 'floating toggle' in i3

    # Not supported, because this command is redundant in AeroSpace mental model.
    # See: https://nikitabobko.github.io/AeroSpace/guide#floating-windows
    #alt-space = 'focus toggle_tiling_floating'

    # `focus parent`/`focus child` are not yet supported, and it's not clear whether they
    # should be supported at all https://github.com/nikitabobko/AeroSpace/issues/5
    # alt-a = 'focus parent'

    alt-0 = 'workspace 0000'
    alt-1 = 'workspace 0001'
    alt-2 = 'workspace 0010'
    alt-3 = 'workspace 0011'
    alt-4 = 'workspace 0100'
    alt-5 = 'workspace 0101'
    alt-6 = 'workspace 0110'
    alt-7 = 'workspace 0111'
    alt-8 = 'workspace 1000'
    alt-9 = 'workspace 1001'

    alt-shift-0 = 'move-node-to-workspace 0000'
    alt-shift-1 = 'move-node-to-workspace 0001'
    alt-shift-2 = 'move-node-to-workspace 0010'
    alt-shift-3 = 'move-node-to-workspace 0011'
    alt-shift-4 = 'move-node-to-workspace 0100'
    alt-shift-5 = 'move-node-to-workspace 0101'
    alt-shift-6 = 'move-node-to-workspace 0110'
    alt-shift-7 = 'move-node-to-workspace 0111'
    alt-shift-8 = 'move-node-to-workspace 1000'
    alt-shift-9 = 'move-node-to-workspace 1001'

    alt-shift-c = 'reload-config'

    alt-r = 'mode resize' # utilizes the section [mode.resize.binding] below

##############################################################################################
##### Custom keybindings #####################################################################
##############################################################################################

    # Quickly toggle 'back and forth' between current and last workspace
    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
    alt-tab = 'workspace-back-and-forth'

    # Custom shortcut to take a screenshot. screencapture is a built-in macOS command
    # See: https://nikitabobko.github.io/AeroSpace/goodies#screenshoot-shortcut
    alt-shift-s = 'exec-and-forget screencapture -i -c'

[mode.resize.binding]
    h = 'resize width -50'
    j = 'resize height +50'
    k = 'resize height -50'
    l = 'resize width +50'
    enter = 'mode main'
    esc = 'mode main'
    alt-r = 'mode main'
